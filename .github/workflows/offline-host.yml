name: Testes offline de host
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m unittest discover -s ci/goodix/tests -v
      - run: make -C tests/spi test sanitize
      - run: make -C research/offline-mcu test sanitize audit
      - run: python3 -B research/offline-kunit/tools/check-protocol-parity.py
