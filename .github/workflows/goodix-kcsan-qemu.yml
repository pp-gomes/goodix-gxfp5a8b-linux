name: Goodix v0.7 KCSAN x86_64 QEMU
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  kcsan-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Set temporary paths
        run: |
          run_root="$RUNNER_TEMP/goodix-kcsan-qemu"
          printf 'RUN_ROOT=%s\nEVIDENCE=%s\n' "$run_root" "$run_root/evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record hosted environment and validate helpers
        run: |
          mkdir -p "$EVIDENCE"
          uname -a > "$EVIDENCE/runner.log"
          cat /etc/os-release >> "$EVIDENCE/runner.log"
          test "$(uname -m)" = x86_64
          python3 -m unittest discover -s ci/goodix/tests -v 2>&1 | tee "$EVIDENCE/helper-tests.log"
      - name: Install kernel and QEMU dependencies
        run: |
          sudo apt-get update 2>&1 | tee "$EVIDENCE/apt-update.log"
          sudo apt-get install --no-install-recommends -y build-essential gcc make binutils git flex bison bc libelf-dev libssl-dev libncurses-dev python3 perl pkg-config rsync file qemu-system-x86 gzip xz-utils zstd lz4 bzip2 2>&1 | tee "$EVIDENCE/dependency-install.log"
          gcc --version > "$EVIDENCE/toolchain.log"
          ld --version >> "$EVIDENCE/toolchain.log"
          python3 --version >> "$EVIDENCE/toolchain.log"
          qemu-system-x86_64 --version >> "$EVIDENCE/toolchain.log"
          dpkg-query -W build-essential gcc make binutils git flex bison bc libelf-dev libssl-dev libncurses-dev python3 perl pkg-config rsync file qemu-system-x86 gzip xz-utils zstd lz4 bzip2 >> "$EVIDENCE/toolchain.log"
      - name: Fetch pinned Linux v6.12
        run: |
          timeout --kill-after=10s 10m bash ci/goodix/fetch-kernel.sh "$RUN_ROOT/kernel" 2>&1 | tee "$EVIDENCE/kernel-fetch.log"
      - name: Configure instrumented kernel, audit, boot QEMU and verify KUnit
        run: |
          python3 ci/goodix/run_kcsan_qemu.py --kernel "$RUN_ROOT/kernel" --source "$GITHUB_WORKSPACE/research/offline-kunit" --work "$RUN_ROOT/work" --artifacts "$EVIDENCE"
      - name: Finalize complete evidence even on failure
        if: always()
        run: |
          mkdir -p "$EVIDENCE"
          if test -f ci/goodix/finalize_kcsan_qemu.py; then
            python3 ci/goodix/finalize_kcsan_qemu.py "$EVIDENCE"
          else
            printf '%s\n' 'Checkout failed; KCSAN execution not verified.' > "$EVIDENCE/collection-error.log"
          fi
      - name: Upload QEMU, KCSAN and KUnit evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goodix-kcsan-qemu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
